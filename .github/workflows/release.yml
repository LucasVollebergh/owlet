name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build owlet.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version in manifest from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' \
            custom_components/owlet/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/owlet/manifest.json

      - name: Build zip
        run: |
          cd custom_components/owlet
          zip -r "$GITHUB_WORKSPACE/owlet.zip" . -x "__pycache__/*"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: owlet.zip
